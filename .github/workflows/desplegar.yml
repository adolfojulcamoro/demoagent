# Despliegue del agente del equipo: solo con cada push a main (el merge de un PR aprobado por el
# líder). Azure solo confía en tokens OIDC de este repo y de la rama main (credencial federada).
name: Desplegar agente

on:
  push:
    branches: [main]

permissions:
  id-token: write   # token OIDC para Azure
  contents: read

concurrency:
  group: desplegar
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/team-${{ vars.TEAM_ID }}/agente:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesión en Azure (OIDC, sin secretos)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Construir y publicar la imagen (solo en team-NN/)
        run: |
          az acr login --name "${ACR%%.*}"
          docker build --build-arg GIT_SHA="${{ github.sha }}" -t "$IMAGE" .
          docker push "$IMAGE"
        env:
          ACR: ${{ vars.ACR_LOGIN_SERVER }}

      - name: Desplegar en la Container App del equipo (solo cambia la imagen)
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -n "${{ vars.CONTAINER_APP }}" -g "${{ vars.RESOURCE_GROUP }}" \
            --image "$IMAGE" --query "properties.latestRevisionName" -o tsv
